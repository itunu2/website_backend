databases:
  - name: strapi-db
    databaseName: strapi
    user: strapi

services:
  - type: web
    name: strapi-backend
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: NODE_OPTIONS
        value: --dns-result-order=ipv4first
      - key: DATABASE_URL
        fromDatabase:
          name: strapi-db
          property: connectionString
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_SSL
        value: "false"
      - key: APP_KEYS
        sync: false
      - key: API_TOKEN_SALT
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: TRANSFER_TOKEN_SALT
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: strapi-uploads
      - key: REDIS_URL
        sync: false
      - key: CACHE_TTL_SECONDS
        value: 300
      - key: SELF_PING_ENABLED
        value: "true"
      - key: SELF_PING_INTERVAL_MINUTES
        value: 10
      - key: PUBLIC_BASE_URL
        sync: false
