services:
  - type: web
    name: strapi-backend
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard to Supabase transaction pooler URL
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: APP_KEYS
        sync: false
      - key: API_TOKEN_SALT
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: TRANSFER_TOKEN_SALT
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: strapi-uploads
      - key: REDIS_URL
        sync: false
      - key: CACHE_TTL_SECONDS
        value: 300
      - key: SELF_PING_ENABLED
        value: "true"
      - key: SELF_PING_INTERVAL_MINUTES
        value: 10
      - key: PUBLIC_BASE_URL
        sync: false  # REQUIRED for self-ping! Set to your Render external URL (e.g. https://strapi-backend-xxxx.onrender.com)
